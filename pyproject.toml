[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chrome-fp"
version = "0.5.0"
description = "与真 Chrome 153 逐字节同指纹(JA4/HTTP2 Akamai/请求头顺序)的纯 Python HTTP 请求库, 用法与 requests 一致"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DreamXiaoJing" }]
keywords = ["chrome", "tls", "fingerprint", "ja4", "http2", "http3", "client-hello", "requests"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "cryptography>=42",
    "hpack>=4",
    "brotli>=1.1",
    "zstandard>=0.22",
    "certifi",
]

[project.optional-dependencies]
# requests 也用它做 apparent_encoding; 装了就自动启用, 没装就退化成 utf-8
encoding = ["charset-normalizer>=3"]
dev = ["pqcrypto>=0.7", "kyber-py"]

[project.urls]
Homepage = "https://github.com/DreamXiaoJing"
Source = "https://github.com/DreamXiaoJing/chrome-fp"
Issues = "https://github.com/DreamXiaoJing/chrome-fp/issues"

[tool.setuptools]
packages = ["chrome_fp"]
